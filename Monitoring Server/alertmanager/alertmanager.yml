global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_FROM}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ["alertname", "environment", "instance"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: "email-receiver"

  routes:
    - match:
        severity: critical
      repeat_interval: 1h
      receiver: "email-receiver"

receivers:
  - name: "default-receiver"

  - name: "email-receiver"
    email_configs:
      - to: "${SMTP_TO}"
        send_resolved: true
        headers:
          Subject: "🚨 [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"
        html: |
          <h2>مدیریت زیرساخت - گزارش هشدار</h2>
          <p><b>وضعیت:</b> {{ .Status }}</p>
          <p><b>محیط:</b> {{ .CommonLabels.environment }}</p>
          <p><b>سرور:</b> {{ .CommonLabels.instance }}</p>
          <p><b>اهمیت:</b> {{ .CommonLabels.severity }}</p>
          <hr>
          <p><b>توضیحات:</b> {{ .CommonAnnotations.description }}</p>
          <br>
          <p style="color: gray; font-size: 12px;">سیستم مانیتورینگ هوشمند - پروژه‌ی Prometheus & Loki</p>
