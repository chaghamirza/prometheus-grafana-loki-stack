groups:
  - name: ssh_security_alerts
    rules:
      - alert: SSHLoginDetected
        expr: |
          sum(count_over_time({instance=~".+"} |= "Accepted" [1m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SSH Login Success on {{ $labels.instance }}"
          description: "A successful SSH login was detected on server {{ $labels.instance }}."
